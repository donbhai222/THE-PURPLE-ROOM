<script>
// --- GLOBAL VARIABLES & LOCALSTORAGE ---
let data = JSON.parse(localStorage.getItem('purpleRoomBills') || '{}'); // Active Running Tables
let settledBills = JSON.parse(localStorage.getItem('purpleRoomSettledBills') || '[]'); // Final Settled Bills for Reports
let menu = JSON.parse(localStorage.getItem('purpleRoomMenu') || 'null') || [
  {name:'Tea', rate:30},
  {name:'Coffee', rate:50},
  {name:'Water Bottle', rate:30}
];

let current = null; // Currently open table ID
let selectedSearchIndex = -1;
let currentDetailSettledIndex = null;
let editingSettledIndex = null;

// --- INITIALIZATION ---
window.onload = function() {
  renderTables();
};

function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function checkLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');

  if(user === 'lagom' && pass === 'lagom01'){
    document.getElementById('loginModal').classList.add('hidden');
  } else {
    err.textContent = 'Invalid Username or Password!';
  }
}

function handleLoginKey(e){
  if(e.key === 'Enter') checkLogin();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('overlay').classList.toggle('active');
}

// --- TABLE MANAGEMENT ---
function renderTables(){
  const premDiv = document.getElementById('premium');
  const stdDiv = document.getElementById('standard');
  if(!premDiv || !stdDiv) return;

  premDiv.innerHTML = '';
  stdDiv.innerHTML = '';

  // Premium Tables R1 to R8
  for(let i=1; i<=8; i++){
    const tId = 'R' + i;
    premDiv.appendChild(createTableButton(tId, 'premium'));
  }

  // Standard Tables S1 to S20
  for(let i=1; i<=20; i++){
    const tId = 'S' + i;
    stdDiv.appendChild(createTableButton(tId, 'standard'));
  }
}

function createTableButton(tId, typeClass){
  const btn = document.createElement('button');
  const runningData = data[tId];
  const isRunning = runningData && runningData.items && runningData.items.length > 0;

  btn.className = `table-btn ${typeClass} ${isRunning ? 'running' : ''}`;
  
  let totalAmt = 0;
  if(isRunning){
    totalAmt = calculateTotal(runningData);
  }

  btn.innerHTML = `
    ${tId}
    <span class="small">${isRunning ? 'Running' : 'Available'}</span>
    ${isRunning ? `<span class="amount">₹ ${totalAmt.toFixed(2)}</span>` : ''}
  `;
  btn.onclick = () => openTable(tId);
  return btn;
}

function openTable(tId){
  current = tId;
  if(!data[current]){
    data[current] = {
      items: [],
      discount: 0,
      discountType: 'amount',
      gst: 0,
      payment: 'Cash',
      guest: '',
      billNo: 'PR-' + (1000 + Math.floor(Math.random() * 9000))
    };
  }

  document.getElementById('tableTitle').textContent = `Table: ${current}`;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('billing').classList.remove('hidden');
  
  // Set values from current table state
  document.getElementById('payment').value = data[current].payment || 'Cash';
  document.getElementById('guest').value = data[current].guest || '';
  document.getElementById('discount').value = data[current].discount || 0;
  document.getElementById('discountType').value = data[current].discountType || 'amount';
  document.getElementById('gst').value = data[current].gst || 0;

  const now = new Date();
  document.getElementById('printBillNo').textContent = data[current].billNo;
  document.getElementById('printDate').textContent = now.toLocaleDateString();
  document.getElementById('printTime').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

  render();
}

function goHome(){
  document.getElementById('billing').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  renderTables();
}

// --- BILLING & ITEM HANDLING ---
function addItem(){
  const name = document.getElementById('item').value.trim();
  const qty = Number(document.getElementById('qty').value);
  const rate = Number(document.getElementById('rate').value);

  if(!name || qty <= 0 || rate < 0){
    alert('Sahi item, quantity aur rate bharein.');
    return;
  }

  if(!data[current]) return;

  const existing = data[current].items.find(x => x.name.toLowerCase() === name.toLowerCase());
  if(existing){
    existing.qty += qty;
  } else {
    data[current].items.push({name, qty, rate});
  }

  // Reset inputs
  document.getElementById('item').value = '';
  document.getElementById('qty').value = 1;
  document.getElementById('rate').value = 0;

  saveRunningData();
  render();
  document.getElementById('item').focus();
}

function removeItem(index){
  if(!data[current]) return;
  data[current].items.splice(index, 1);
  saveRunningData();
  render();
}

function render(){
  if(!current || !data[current]) return;

  const cur = data[current];
  cur.payment = document.getElementById('payment').value;
  cur.guest = document.getElementById('guest').value;
  cur.discount = Number(document.getElementById('discount').value || 0);
  cur.discountType = document.getElementById('discountType').value;
  cur.gst = Number(document.getElementById('gst').value || 0);

  const tbody = document.getElementById('items');
  tbody.innerHTML = '';

  let subtotal = 0;
  cur.items.forEach((item, index) => {
    const amt = item.qty * item.rate;
    subtotal += amt;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(item.name)}</td>
      <td>${item.qty}</td>
      <td>₹ ${item.rate}</td>
      <td>₹ ${amt.toFixed(2)}</td>
      <td class="no-print"><button class="btn-sm btn-del" onclick="removeItem(${index})">✕</button></td>
    `;
    tbody.appendChild(tr);
  });

  let d = cur.discount;
  let discountVal = cur.discountType === 'percent' ? (subtotal * d / 100) : d;
  discountVal = Math.min(Math.max(discountVal, 0), subtotal);

  let afterDiscount = subtotal - discountVal;
  let gstVal = (afterDiscount * cur.gst) / 100;
  let grandTotal = afterDiscount + gstVal;

  document.getElementById('subtotal').textContent = subtotal.toFixed(2);
  document.getElementById('discountValue').textContent = discountVal.toFixed(2);
  document.getElementById('gstValue').textContent = gstVal.toFixed(2);
  document.getElementById('total').textContent = grandTotal.toFixed(2);
  document.getElementById('billNo').textContent = cur.billNo;
  document.getElementById('status').textContent = cur.items.length > 0 ? 'Running' : 'Available';

  saveRunningData();
}

function saveRunningData(){
  localStorage.setItem('purpleRoomBills', JSON.stringify(data));
}

function clearBill(){
  if(confirm('Kya aap is bill ke saare items hatana chahte hain?')){
    data[current].items = [];
    saveRunningData();
    render();
  }
}

// --- KOT PRINT (SAVES TEMPORARILY TO RUNNING TABLE ONLY) ---
function saveAndPrintKOT(){
  if(!data[current] || data[current].items.length === 0){
    alert('Bill me koi item nahi hai!');
    return;
  }

  saveRunningData(); // Save to local running data only
  
  const printArea = document.getElementById('kotPrintArea');
  const now = new Date();
  
  let kotHTML = `
    <div style="text-align:center; font-family:'Courier New', monospace; font-size:12px;">
      <h2>--- KOT ---</h2>
      <b>Table: ${current}</b><br>
      <span>Date: ${now.toLocaleDateString()} | ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
      <hr style="border-top:1px dashed #000;">
      <table style="width:100%; text-align:left; font-size:12px;">
        <thead><tr><th>Item</th><th style="text-align:right">Qty</th></tr></thead>
        <tbody>
  `;

  data[current].items.forEach(item => {
    kotHTML += `<tr><td>${escapeHtml(item.name)}</td><td style="text-align:right">${item.qty}</td></tr>`;
  });

  kotHTML += `
        </tbody>
      </table>
      <hr style="border-top:1px dashed #000;">
    </div>
  `;

  printArea.innerHTML = kotHTML;
  document.body.classList.add('printing-kot');
  window.print();
  document.body.classList.remove('printing-kot');
}

// --- SETTLE BILL (PERMANENTLY SAVES TO REPORTS) ---
function openSettle(){
  if(!data[current] || data[current].items.length === 0){
    alert('Settle karne ke liye bill me items hone chahiye!');
    return;
  }

  document.getElementById('settleTable').textContent = current;
  document.getElementById('settleBillNo').textContent = data[current].billNo;
  document.getElementById('settleDiscount').value = data[current].discount || 0;
  document.getElementById('settleDiscountType').value = data[current].discountType || 'amount';
  document.getElementById('settleGst').value = data[current].gst || 0;
  document.getElementById('settleAdjustment').value = 0;
  document.getElementById('settlePayment').value = data[current].payment || 'Cash';
  document.getElementById('settleGuest').value = data[current].guest || '';

  renderSettle();
  document.getElementById('settleModal').style.display = 'flex';
}

function closeSettle(){
  document.getElementById('settleModal').style.display = 'none';
}

function renderSettle(){
  const cur = data[current];
  let subtotal = cur.items.reduce((s, x) => s + (x.qty * x.rate), 0);

  let d = Number(document.getElementById('settleDiscount').value || 0);
  let dType = document.getElementById('settleDiscountType').value;
  let discountVal = dType === 'percent' ? (subtotal * d / 100) : d;
  discountVal = Math.min(Math.max(discountVal, 0), subtotal);

  let gst = Number(document.getElementById('settleGst').value || 0);
  let afterDiscount = subtotal - discountVal;
  let gstVal = (afterDiscount * gst) / 100;

  let adj = Number(document.getElementById('settleAdjustment').value || 0);
  let finalTotal = afterDiscount + gstVal + adj;

  document.getElementById('settleSubtotal').textContent = subtotal.toFixed(2);
  document.getElementById('settleDiscountValue').textContent = discountVal.toFixed(2);
  document.getElementById('settleGstValue').textContent = gstVal.toFixed(2);
  document.getElementById('settleAdjustmentValue').textContent = adj.toFixed(2);
  document.getElementById('settleFinalTotal').textContent = Math.max(0, finalTotal).toFixed(2);
}

function settleBill(shouldPrint){
  const cur = data[current];
  let subtotal = cur.items.reduce((s, x) => s + (x.qty * x.rate), 0);
  let d = Number(document.getElementById('settleDiscount').value || 0);
  let dType = document.getElementById('settleDiscountType').value;
  let discountVal = dType === 'percent' ? (subtotal * d / 100) : d;
  discountVal = Math.min(Math.max(discountVal, 0), subtotal);

  let gst = Number(document.getElementById('settleGst').value || 0);
  let afterDiscount = subtotal - discountVal;
  let gstVal = (afterDiscount * gst) / 100;
  let adj = Number(document.getElementById('settleAdjustment').value || 0);
  let finalTotal = Math.max(0, afterDiscount + gstVal + adj);

  const settledRecord = {
    billNo: cur.billNo,
    tableId: current,
    items: JSON.parse(JSON.stringify(cur.items)),
    subtotal: subtotal,
    discount: d,
    discountType: dType,
    discountValue: discountVal,
    gst: gst,
    gstValue: gstVal,
    adjustment: adj,
    finalTotal: finalTotal,
    payment: document.getElementById('settlePayment').value,
    guest: document.getElementById('settleGuest').value,
    settledAt: new Date().toISOString()
  };

  // Push into permanent Settled Bills Array
  settledBills.push(settledRecord);
  localStorage.setItem('purpleRoomSettledBills', JSON.stringify(settledBills));

  // Clear running table data
  delete data[current];
  saveRunningData();

  closeSettle();

  if(shouldPrint){
    window.print();
  }

  alert(`Table ${current} ka bill successfully settle ho gaya!`);
  goHome();
}

// --- ITEM MASTER MANAGEMENT ---
function saveMenu(){
  localStorage.setItem('purpleRoomMenu', JSON.stringify(menu));
  renderManageList();
}

function showItemMaster(){
  document.getElementById('home').classList.add('hidden');
  document.getElementById('itemMasterView').classList.remove('hidden');
  renderManageList();
}

function hideItemMaster(){
  document.getElementById('itemMasterView').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}

function addMenuItem(){
  const name = document.getElementById('newItemName').value.trim();
  const rate = Number(document.getElementById('newItemRate').value);
  if(!name || rate < 0){ alert('Item name aur rate sahi bharo.'); return; }

  const existing = menu.find(x => x.name.toLowerCase() === name.toLowerCase());
  if(existing){
    existing.rate = rate;
  } else {
    menu.push({name, rate});
  }
  saveMenu();
  document.getElementById('newItemName').value = '';
  document.getElementById('newItemRate').value = '';
  alert('Item database me add/update ho gaya!');
}

function renderManageList(){
  const div = document.getElementById('menuManageList');
  if(!div) return;
  div.innerHTML = '';
  if(!menu.length){
    div.innerHTML = '<p style="font-size:13px;color:#666">Koi item add nahi hua hai.</p>';
    return;
  }
  menu.forEach((x, index) => {
    const row = document.createElement('div');
    row.className = 'item-manage-row';
    row.innerHTML = `
      <span><b>${escapeHtml(x.name)}</b> - ₹${x.rate}</span>
      <div>
        <button class="btn-sm btn-edit" onclick="editMenuItem(${index})">Edit</button>
        <button class="btn-sm btn-del" onclick="deleteMenuItem(${index})">Delete</button>
      </div>
    `;
    div.appendChild(row);
  });
}

function editMenuItem(index){
  const item = menu[index];
  const newName = prompt("Item ka Naya Name dalein:", item.name);
  if(newName === null) return;
  const newRate = prompt("Item ka Naya Rate dalein:", item.rate);
  if(newRate === null) return;

  const parsedRate = Number(newRate);
  if(!newName.trim() || isNaN(parsedRate) || parsedRate < 0){
    alert("Sahi name aur rate bharo.");
    return;
  }

  menu[index] = {name: newName.trim(), rate: parsedRate};
  saveMenu();
}

function deleteMenuItem(index){
  if(confirm(`Kya aap "${menu[index].name}" ko hatana chahte hain?`)){
    menu.splice(index, 1);
    saveMenu();
  }
}

// --- SEARCH AUTOCOMPLETE ---
function searchItems(){
  const input = document.getElementById('item');
  const filter = input.value.toLowerCase().trim();
  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = '';
  selectedSearchIndex = -1;

  if(!filter){
    resultsDiv.style.display = 'none';
    return;
  }

  const matches = menu.filter(x => x.name.toLowerCase().includes(filter));

  if(matches.length > 0){
    matches.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'search-item';
      div.dataset.index = index;
      div.innerHTML = `<span>${escapeHtml(item.name)}</span><b>₹ ${item.rate}</b>`;
      div.onclick = () => selectSearchItem(item.name, item.rate);
      resultsDiv.appendChild(div);
    });
    resultsDiv.style.display = 'block';
  } else {
    resultsDiv.style.display = 'none';
  }
}

function handleSearchKey(e){
  const resultsDiv = document.getElementById('searchResults');
  const items = resultsDiv.querySelectorAll('.search-item');
  if(!items.length || resultsDiv.style.display === 'none'){
    if(e.key === 'Enter') addItem();
    return;
  }

  if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(selectedSearchIndex < items.length - 1){
      selectedSearchIndex++;
      updateSearchSelection(items);
    }
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(selectedSearchIndex > 0){
      selectedSearchIndex--;
      updateSearchSelection(items);
    }
  } else if(e.key === 'Enter'){
    e.preventDefault();
    if(selectedSearchIndex >= 0 && items[selectedSearchIndex]){
      items[selectedSearchIndex].click();
    } else {
      addItem();
    }
  }
}

function updateSearchSelection(items){
  items.forEach((item, idx) => {
    if(idx === selectedSearchIndex){
      item.classList.add('selected');
      item.scrollIntoView({block: 'nearest'});
    } else {
      item.classList.remove('selected');
    }
  });
}

function selectSearchItem(name, rate){
  document.getElementById('item').value = name;
  document.getElementById('rate').value = rate;
  document.getElementById('searchResults').style.display = 'none';
  selectedSearchIndex = -1;
  document.getElementById('qty').focus();
  document.getElementById('qty').select();
}

document.addEventListener('click', function(e){
  const searchBox = document.querySelector('.search-wrapper');
  if(searchBox && !searchBox.contains(e.target)){
    document.getElementById('searchResults').style.display = 'none';
  }
});

function calculateTotal(t){
  if (!t || !t.items) return 0;
  let subtotal = t.items.reduce((s, x) => s + (x.qty * x.rate), 0);
  let d = Number(t.discount || 0);
  let discount = t.discountType === 'percent' ? (subtotal * d / 100) : d;
  discount = Math.min(Math.max(discount, 0), subtotal);
  return (subtotal - discount) + ((subtotal - discount) * Number(t.gst || 0) / 100);
}

// --- DAILY REPORTS & ITEM-WISE REPORTS ---
function showReports(){
  document.getElementById('home').classList.add('hidden');
  document.getElementById('reports').classList.remove('hidden');
  const rows = document.getElementById('reportRows');
  rows.innerHTML = '';

  let bills = 0, sales = 0, cash = 0, upi = 0, card = 0;

  settledBills.forEach((t, idx) => {
    const total = Number(t.finalTotal != null ? t.finalTotal : calculateTotal(t)); 
    bills++; 
    sales += total;
    if(t.payment === 'Cash') cash += total; 
    else if(t.payment === 'UPI') upi += total; 
    else if(t.payment === 'Card') card += total;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(t.billNo || '-')}</td>
      <td>${escapeHtml(t.tableId || '-')}</td>
      <td>${escapeHtml(t.guest || '-')}</td>
      <td>${escapeHtml(t.payment || '-')}</td>
      <td>₹ ${total.toFixed(2)}</td>
      <td class="no-print">
        <button class="btn-action primary" onclick="viewSettledBill(${idx})">View</button>
      </td>
    `;
    rows.appendChild(tr);
  });

  document.getElementById('rBills').textContent = bills;
  document.getElementById('rSales').textContent = sales.toFixed(2);
  document.getElementById('rCash').textContent = cash.toFixed(2);
  document.getElementById('rUpi').textContent = upi.toFixed(2);
  document.getElementById('rCard').textContent = card.toFixed(2);
  document.getElementById('itemWiseReport').classList.add('hidden');
}

function hideReports(){
  document.getElementById('reports').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}

function showItemWiseReport(){
  const reportDiv = document.getElementById('itemWiseReport');
  reportDiv.classList.toggle('hidden');
  if(reportDiv.classList.contains('hidden')) return;

  const tbody = document.getElementById('itemWiseRows');
  tbody.innerHTML = '';
  
  let itemStats = {};

  settledBills.forEach(bill => {
    if (bill.items) {
      bill.items.forEach(item => {
        if (!itemStats[item.name]) {
          itemStats[item.name] = { qty: 0, amount: 0 };
        }
        itemStats[item.name].qty += Number(item.qty);
        itemStats[item.name].amount += (Number(item.qty) * Number(item.rate));
      });
    }
  });

  for (let itemName in itemStats) {
    const stat = itemStats[itemName];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(itemName)}</td>
      <td>${stat.qty}</td>
      <td>₹ ${stat.amount.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  }
}

function exportClosingItemWiseExcel(){
  let csv = 'Item Name,Qty Sold,Sales Amount\n';
  let itemStats = {};

  settledBills.forEach(bill => {
    if (bill.items) {
      bill.items.forEach(item => {
        if (!itemStats[item.name]) {
          itemStats[item.name] = { qty: 0, amount: 0 };
        }
        itemStats[item.name].qty += Number(item.qty);
        itemStats[item.name].amount += (Number(item.qty) * Number(item.rate));
      });
    }
  });

  for (let name in itemStats) {
    csv += `"${name}",${itemStats[name].qty},${itemStats[name].amount}\n`;
  }

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.setAttribute('href', url);
  a.setAttribute('download', `Item_Sales_Report_${new Date().toISOString().slice(0,10)}.csv`);
  a.click();
}

// --- VIEW SETTLED BILL DETAILS ---
function viewSettledBill(idx){
  const bill = settledBills[idx];
  if(!bill) return;

  currentDetailSettledIndex = idx;
  const content = document.getElementById('detailContent');
  
  let itemsTable = `
    <table class="bill">
      <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
      <tbody>
  `;
  bill.items.forEach(i => {
    itemsTable += `<tr><td>${escapeHtml(i.name)}</td><td>${i.qty}</td><td>₹ ${i.rate}</td><td>₹ ${(i.qty*i.rate).toFixed(2)}</td></tr>`;
  });
  itemsTable += `</tbody></table>`;

  content.innerHTML = `
    <div class="print-head">
      <h2>THE PURPLE ROOM</h2>
      <div>SETTLED BILL RECEIPT</div>
      <div class="print-meta">
        <span>Bill No: <b>${escapeHtml(bill.billNo || '-')}</b></span>
        <span>Table: <b>${escapeHtml(bill.tableId || '-')}</b></span>
      </div>
    </div>
    <p><b>Guest Name:</b> ${escapeHtml(bill.guest || 'N/A')}</p>
    <p><b>Payment Mode:</b> ${escapeHtml(bill.payment || 'Cash')}</p>
    ${itemsTable}
    <div class="total">Final Paid: ₹ ${(bill.finalTotal || calculateTotal(bill)).toFixed(2)}</div>
  `;

  document.getElementById('reports').classList.add('hidden');
  document.getElementById('closing').classList.add('hidden');
  document.getElementById('billDetail').classList.remove('hidden');
}

function hideBillDetail(){
  document.getElementById('billDetail').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}

// --- RESET DEMO DATA ---
function resetAllData(){
  if(confirm('Kya aap saara bill aur sales data clear karna chahte hain? (Menu reset nahi hoga)')){
    localStorage.removeItem('purpleRoomBills');
    localStorage.removeItem('purpleRoomSettledBills');
    data = {};
    settledBills = [];
    renderTables();
    alert('Saara billing data reset ho gaya!');
  }
}

// --- CLOUD SETUP PLACEHOLDERS ---
function openCloudSetup(){
  document.getElementById('cloudSetup').style.display = 'flex';
}
function saveCloudConfig(){
  alert('Cloud config saved locally.');
  document.getElementById('cloudSetup').style.display = 'none';
}
function initCloud(test = false){
  if(test) alert('Local storage mode active.');
}
</script>
